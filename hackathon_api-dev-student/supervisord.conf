[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[program:fastapi]
command=/opt/conda/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/workspace
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
environment=PYTHONUNBUFFERED="1"
priority=1

[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password /workspace
directory=/workspace
user=participant
environment=HOME="/home/participant",PASSWORD="%(ENV_CODE_SERVER_PASSWORD)s"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/code-server.err.log
stdout_logfile=/var/log/supervisor/code-server.out.log
priority=2

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=3
